apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  releaseName: capi-operator
  targetNamespace: cluster-api-system
  interval: 15m
  chart:
    spec:
      chart: cluster-api-operator
      version: "0.27.0"
      sourceRef:
        kind: HelmRepository
        name: cluster-api-operator
        namespace: flux-system
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace